services:
  app:
    build: .
    image: kgrib275/hy-project:latest
    ports:
      - "8000:8000"
    volumes:
      - .:/app  # 내 로컬의 소스 코드 폴더와 컨테이너 내부를 실시간 동기화
    environment:
      - PYTHONUNBUFFERED=1
    # 👇 핵심: --reload 옵션을 붙여서 파이썬 코드 변경을 감지하게 합니다
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload