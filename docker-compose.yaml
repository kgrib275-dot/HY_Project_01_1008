services:
  app:
    build: .
    image: kgrib275/hy-project:latest
    ports:
      - "8000:8000"
    volumes:
      # 이미지 안의 /app/static(프론트 빌드 결과)을 가리지 않도록 main.py만 마운트
      - ./backend/main.py:/app/main.py
    environment:
      - PYTHONUNBUFFERED=1
      # 쉼표 구분. 비우면 모든 출처 허용(개발용)
      - CORS_ORIGINS=${CORS_ORIGINS:-}
    # 개발 편의: 파이썬 코드 변경 시 자동 재시작
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
